{% assign page_title = page.title | default: site.title %}
{% assign page_description = page.description | default: site.description %}
{% assign page_image = page.image | default: '/assets/images/social-preview.png' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ site.url }}/#organization",
      "name": "IVA",
      "legalName": {{ site.legal_name | jsonify }},
      "url": "{{ site.url }}/",
      "logo": "{{ site.url }}/assets/images/tmlogo.png",
      "image": "{{ site.url }}/assets/images/social-preview.png",
      "email": "mailto:{{ site.email }}",
      "description": {{ site.description | jsonify }},
      "slogan": {{ site.tagline | jsonify }},
      "founder": {
        "@type": "Person",
        "name": "Evan Foster"
      },
      "areaServed": {
        "@type": "Country",
        "name": "United States"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "email": {{ site.email | jsonify }},
        "areaServed": "US",
        "availableLanguage": "en"
      }
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}/",
      "name": "IVA",
      "description": {{ site.description | jsonify }},
      "publisher": {
        "@id": "{{ site.url }}/#organization"
      },
      "inLanguage": "en"
    },
    {
      "@type": "WebPage",
      "@id": "{{ site.url }}{{ page.url }}#webpage",
      "url": "{{ site.url }}{{ page.url }}",
      "name": {{ page_title | append: ' | IVA' | jsonify }},
      "description": {{ page_description | jsonify }},
      "isPartOf": {
        "@id": "{{ site.url }}/#website"
      },
      "about": {
        "@id": "{{ site.url }}/#organization"
      },
      "inLanguage": "en"
    }{% if page.schema_type == "Article" %},
    {
      "@type": "Article",
      "@id": "{{ site.url }}{{ page.url }}#article",
      "headline": {{ page_title | jsonify }},
      "description": {{ page_description | jsonify }},
      "image": "{{ site.url }}{{ page_image }}",
      "author": {
        "@type": "Person",
        "name": "{{ site.author.name }}"
      },
      "publisher": {
        "@id": "{{ site.url }}/#organization"
      },
      "mainEntityOfPage": {
        "@id": "{{ site.url }}{{ page.url }}#webpage"
      },
      "inLanguage": "en"
    }{% elsif page.schema_type == "Service" %},
    {
      "@type": "Service",
      "@id": "{{ site.url }}{{ page.url }}#service",
      "name": {{ page_title | jsonify }},
      "description": {{ page_description | jsonify }},
      "provider": {
        "@id": "{{ site.url }}/#organization"
      },
      "areaServed": {
        "@type": "Country",
        "name": "United States"
      },
      "url": "{{ site.url }}{{ page.url }}"
    }{% endif %}{% unless page.url == "/" %},
    {
      "@type": "BreadcrumbList",
      "@id": "{{ site.url }}{{ page.url }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "{{ site.url }}/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": {{ page_title | jsonify }},
          "item": "{{ site.url }}{{ page.url }}"
        }
      ]
    }
    {% endunless %}
  ]
}
</script>
